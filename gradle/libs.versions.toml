[versions]
java = "21"
sonarqube = "7.4.0.8496"
jacoco = "0.8.10"
spring-boot = "4.1.1"
springdoc = "3.1.0"

[libraries]
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { group = "org.springframework.boot", name = "spring-boot-gradle-plugin", version.ref = "spring-boot" }
swagger-ui = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
